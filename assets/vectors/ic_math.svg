<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="math_board" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="60%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="math_frame" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="sym_gold" x1="16" y1="16" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Wooden Frame / Card Base -->
  <rect x="6" y="6" width="52" height="52" rx="14" fill="url(#math_frame)"/>

  <!-- Inner Chalkboard / Digital Slate -->
  <rect x="9.5" y="9.5" width="45" height="45" rx="10.5" fill="url(#math_board)"/>

  <!-- Grid Divider lines in chalkboard -->
  <line x1="32" y1="12" x2="32" y2="52" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="12" y1="32" x2="52" y2="32" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- Quadrant 1: Plus (+) Top-Left -->
  <g fill="#38BDF8">
    <rect x="20" y="16" width="4" height="12" rx="2"/>
    <rect x="16" y="20" width="12" height="4" rx="2"/>
  </g>

  <!-- Quadrant 2: Minus (−) Top-Right -->
  <g fill="url(#sym_gold)">
    <rect x="36" y="20" width="12" height="4" rx="2"/>
  </g>

  <!-- Quadrant 3: Multiply (×) Bottom-Left -->
  <g fill="#F43F5E">
    <path d="M17.5 38.5C18.2 37.8 19.3 37.8 20 38.5L22 40.5L24 38.5C24.7 37.8 25.8 37.8 26.5 38.5C27.2 39.2 27.2 40.3 26.5 41L24.5 43L26.5 45C27.2 45.7 27.2 46.8 26.5 47.5C25.8 48.2 24.7 48.2 24 47.5L22 45.5L20 47.5C19.3 48.2 18.2 48.2 17.5 47.5C16.8 46.8 16.8 45.7 17.5 45L19.5 43L17.5 41C16.8 40.3 16.8 39.2 17.5 38.5Z"/>
  </g>

  <!-- Quadrant 4: Divide (÷) Bottom-Right -->
  <g fill="#34D399">
    <circle cx="42" cy="37" r="2.2"/>
    <rect x="36" y="41" width="12" height="3.5" rx="1.75"/>
    <circle cx="42" cy="48" r="2.2"/>
  </g>

  <!-- Center Badge / Pi / Root Symbol -->
  <circle cx="32" cy="32" r="5" fill="#FFFFFF"/>
  <text x="32" y="35.5" font-family="Arial, sans-serif" font-weight="900" font-size="9" fill="#047857" text-anchor="middle">π</text>
</svg>

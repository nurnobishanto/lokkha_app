<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="video_body" x1="8" y1="8" x2="56" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="video_screen" x1="10" y1="11" x2="54" y2="41" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="video_stand" x1="24" y1="44" x2="40" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="play_btn_grad" x1="26" y1="20" x2="38" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF405C"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
  </defs>

  <!-- Monitor Stand Base & Neck -->
  <rect x="22" y="54" width="20" height="4" rx="2" fill="url(#video_stand)"/>
  <rect x="29" y="44" width="6" height="11" rx="1.5" fill="url(#video_stand)"/>

  <!-- Main Monitor Body with Rounded Bezel -->
  <rect x="7" y="8" width="50" height="38" rx="8" fill="url(#video_body)"/>

  <!-- Glossy Display Screen -->
  <rect x="10.5" y="11.5" width="43" height="31" rx="5" fill="url(#video_screen)"/>

  <!-- Screen Top Reflection Line -->
  <path d="M12 13C12 12.4477 12.4477 12 13 12H51C51.5523 12 52 12.4477 52 13V22C52 22 40 25 32 25C24 25 12 22 12 22V13Z" fill="white" fill-opacity="0.08"/>

  <!-- WebCam Dot at Top Center -->
  <circle cx="32" cy="10" r="1" fill="#FFFFFF"/>

  <!-- Central Play Circle Button -->
  <circle cx="32" cy="27" r="10" fill="url(#play_btn_grad)"/>
  <circle cx="32" cy="27" r="9" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" fill="none"/>

  <!-- Play Arrow Triangle -->
  <path d="M30 22.5C29.4477 22.181 28.75 22.5833 28.75 23.2189V30.7811C28.75 31.4167 29.4477 31.819 30 31.5L36.05 27.7189C36.6 27.3752 36.6 26.6248 36.05 26.2811L30 22.5Z" fill="#FFFFFF"/>

  <!-- Live/Class Badge Dot at Bottom-Right of Screen -->
  <circle cx="48" cy="37" r="2" fill="#10B981"/>
</svg>

name: lokkha
description: Lokkha project.
publish_to: 'none'

version: 2.03.13+33

environment:
  sdk: '>=3.0.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  logger: ^2.5.0
  flutter_screenutil: ^5.9.3
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  shared_preferences: ^2.3.5
  cupertino_icons: ^1.0.2
  cached_network_image: ^3.4.1
  pinput: ^5.0.1
  carousel_slider: ^5.0.0
  dots_indicator: ^4.0.0
  url_launcher: ^6.3.1
  intl: ^0.20.2
  flutter_widget_from_html_core: ^0.17.2
  get_storage: ^2.1.1
  syncfusion_flutter_pdfviewer: ^29.1.39
  device_info_plus: ^11.4.0
  webview_flutter: ^4.13.0
  share_plus: ^11.0.0
  package_info_plus: ^8.3.0
  image_picker: ^1.1.2
  image_cropper: ^9.1.0
  http_parser: ^4.1.2
  onesignal_flutter: ^5.6.5
  json_annotation: ^4.9.0
  flutter_dotenv: ^5.2.1
  youtube_player_flutter: ^9.1.2
  photo_view: ^0.15.0
  lottie: ^3.3.2
  app_links: ^7.0.0
  permission_handler: ^12.0.1
  font_awesome_flutter: ^11.0.0
  flutter_secure_storage: ^9.2.2
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  flutter_lints: ^5.0.0
  http_mock_adapter: ^0.6.1
  rename_app: ^1.6.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/vectors/
    - assets/fonts/
    - assets/lottie/
    - .env

  fonts:
    - family: BalooDa2
      fonts:
        - asset: assets/fonts/BalooDa2-Regular.ttf
          weight: 400
        - asset: assets/fonts/BalooDa2-Medium.ttf
          weight: 500
        - asset: assets/fonts/BalooDa2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BalooDa2-Bold.ttf
          weight: 700
        - asset: assets/fonts/BalooDa2-ExtraBold.ttf
          weight: 800
